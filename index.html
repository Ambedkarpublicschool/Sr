<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SR Form Generator & Printing Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
    }
    body {
      background-color: #f1f5f9;
      color: #000;
    }

    .app-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
    }
    .panel {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .control-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .filters-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"], select {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-success { background: #16a34a; color: white; }
    .btn-secondary { background: #64748b; color: white; }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    table.data-table th, table.data-table td {
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      text-align: left;
      font-size: 14px;
    }
    table.data-table th {
      background: #f8fafc;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    #print-container {
      display: none;
    }

    .sr-page {
      width: 100%;
    }

    .sr-card {
      width: 100%;
      border: 1.5px solid #000;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 6mm;
      height: 135mm;
      box-sizing: border-box;
      background: #fff;
      overflow: hidden;
    }

    .sr-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .sr-title-block {
      flex: 1;
      text-align: center;
    }
    .sr-title-block h2 {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.2;
    }
    .sr-title-block p {
      font-size: 11px;
      margin-top: 1px;
    }
    .sr-number-badge {
      font-size: 17px;
      font-weight: bold;
      min-width: 60px;
      text-align: right;
    }

    .meta-line {
      display: flex;
      border: 1px solid #000;
      font-size: 9.5px;
      margin-bottom: 4px;
    }
    .meta-cell {
      flex: 1;
      padding: 2px 4px;
      border-right: 1px solid #000;
      white-space: nowrap;
    }
    .meta-cell:last-child {
      border-right: none;
    }

    .main-grid {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 4px;
    }
    .main-grid th, .main-grid td {
      border: 1px solid #000;
      padding: 3px 4px;
      vertical-align: top;
      font-size: 9.5px;
      line-height: 1.25;
    }
    .main-grid th {
      text-align: center;
      font-weight: 600;
      background: transparent;
      font-size: 9px;
    }

    .box-digits {
      display: inline-flex;
      border: 1px solid #000;
      margin-top: 2px;
    }
    .box-digit {
      width: 12px;
      height: 13px;
      border-right: 1px solid #000;
      text-align: center;
      font-size: 9.5px;
      line-height: 13px;
    }
    .box-digit:last-child {
      border-right: none;
    }

    .info-strip {
      display: flex;
      border: 1px solid #000;
      border-bottom: none;
      font-size: 9.5px;
    }
    .info-strip:last-of-type {
      border-bottom: 1px solid #000;
      margin-bottom: 4px;
    }
    .strip-cell {
      padding: 2px 4px;
      border-right: 1px solid #000;
    }
    .strip-cell:last-child {
      border-right: none;
    }

    .table-footer {
      width: 100%;
      border-collapse: collapse;
    }
    .table-footer th, .table-footer td {
      border: 1px solid #000;
      font-size: 8.5px;
      padding: 2px;
      text-align: center;
      height: 16px;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 6mm 6mm;
      }
      body {
        background: transparent !important;
      }
      .no-print {
        display: none !important;
      }
      #print-container {
        display: block !important;
      }
      .page-break {
        page-break-after: always;
        break-after: page;
      }
    }
  </style>
</head>
<body>

  <div class="app-container no-print">
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h1 style="font-size: 20px; font-weight: bold;">छात्र पत्रावली (SR Form) प्रिंट पोर्टल</h1>
        <div id="status-tag" style="font-size: 13px; color: #64748b;">⏳ डेटा लोड हो रहा है...</div>
      </div>
      
      <div class="control-bar">
        <div class="filters-group">
          <select id="session-filter" onchange="renderTable()">
            <option value="">All Sessions</option>
          </select>
          <select id="class-filter" onchange="renderTable()">
            <option value="">All Classes</option>
          </select>
          <input type="text" id="search-input" placeholder="Search Name, SR, Father..." oninput="renderTable()" style="width: 240px;">
          <button class="btn btn-secondary" onclick="fetchSheetData()">↻ Refresh</button>
        </div>

        <button class="btn btn-success" onclick="prepareAndPrint()">
          🖨️ Print Selected (<span id="selected-count">0</span>)
        </button>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 35px;"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th>
            <th onclick="sortTable('srNo')">SR No ⇕</th>
            <th onclick="sortTable('studentName')">Student Name ⇕</th>
            <th onclick="sortTable('fatherName')">Father Name ⇕</th>
            <th onclick="sortTable('className')">Class ⇕</th>
            <th onclick="sortTable('session')">Session ⇕</th>
          </tr>
        </thead>
        <tbody id="student-table-body">
          <tr>
            <td colspan="6" style="text-align: center; color: #64748b;">डेटा लोड हो रहा है...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="print-container"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbygVe44nYKylWKzhkHbdv3o5NmyJ6rAXARKy3xmRXja1mai3kBWLcshNH03Ge6c3FCn/exec';
    
    let allStudents = [];
    let selectedStudentIds = new Set();
    let currentSort = { col: 'srNo', asc: true };

    // Full Date to English Words logic
    function convertDateToWords(dayStr, monthStr, yearStr) {
      let d = parseInt(dayStr, 10);
      let m = parseInt(monthStr, 10);
      let y = parseInt(yearStr, 10);

      if (isNaN(d) || isNaN(m) || isNaN(y)) return "";

      const daysWords = [
        "", "First", "Second", "Third", "Fourth", "Fifth", "Sixth", "Seventh", "Eighth", "Ninth", "Tenth",
        "Eleventh", "Twelfth", "Thirteenth", "Fourteenth", "Fifteenth", "Sixteenth", "Seventeenth", "Eighteenth", "Nineteenth", "Twentieth",
        "Twenty First", "Twenty Second", "Twenty Third", "Twenty Fourth", "Twenty Fifth", "Twenty Sixth", "Twenty Seventh", "Twenty Eighth", "Twenty Ninth", "Thirtieth", "Thirty First"
      ];
      
      const months = [
        "January", "February", "March", "April", "May", "June", 
        "July", "August", "September", "October", "November", "December"
      ];

      function convertNumberToWords(n) {
        const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
        const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

        if (n < 20) return ones[n];
        if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 !== 0 ? " " + ones[n % 10] : "");
        if (n < 1000) return ones[Math.floor(n / 100)] + " Hundred" + (n % 100 !== 0 ? " " + convertNumberToWords(n % 100) : "");
        if (n < 100000) return convertNumberToWords(Math.floor(n / 1000)) + " Thousand" + (n % 1000 !== 0 ? " " + convertNumberToWords(n % 1000) : "");
        return String(n);
      }

      let dWord = daysWords[d] || String(d);
      let mWord = months[m - 1] || "";
      let yWord = convertNumberToWords(y);

      return `${dWord} ${mWord} ${yWord}`.trim();
    }

    async function fetchSheetData() {
      const tag = document.getElementById('status-tag');
      tag.innerText = '⏳ डेटा लोड हो रहा है...';

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        allStudents = Array.isArray(data) ? data : (data.students || []);
        const sessions = data.sessions || [...new Set(allStudents.map(s => s.session).filter(Boolean))];
        
        const sessionFilter = document.getElementById('session-filter');
        sessionFilter.innerHTML = '<option value="">All Sessions</option>';
        sessions.forEach(s => {
          sessionFilter.innerHTML += `<option value="${s}">${s}</option>`;
        });

        if (sessions.length > 0) {
          sessionFilter.value = sessions[sessions.length - 1];
        }

        const classes = [...new Set(allStudents.map(s => s.className).filter(Boolean))];
        const classFilter = document.getElementById('class-filter');
        classFilter.innerHTML = '<option value="">All Classes</option>';
        classes.forEach(c => {
          classFilter.innerHTML += `<option value="${c}">${c}</option>`;
        });

        tag.innerText = `✓ Total Students: ${allStudents.length}`;
        renderTable();
      } catch (err) {
        tag.innerText = '⚠️ डेटा लोड करने में त्रुटि';
      }
    }

    function renderTable() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const classVal = document.getElementById('class-filter').value;
      const sessionVal = document.getElementById('session-filter').value;
      const tbody = document.getElementById('student-table-body');

      let filtered = allStudents.filter(s => {
        const matchesSearch = (s.studentName + " " + s.fatherName + " " + s.srNo).toLowerCase().includes(search);
        const matchesClass = !classVal || s.className === classVal;
        const matchesSession = !sessionVal || s.session === sessionVal;
        return matchesSearch && matchesClass && matchesSession;
      });

      filtered.sort((a, b) => {
        let valA = a[currentSort.col] || "";
        let valB = b[currentSort.col] || "";
        return currentSort.asc ? valA.toString().localeCompare(valB.toString(), undefined, {numeric: true}) 
                               : valB.toString().localeCompare(valA.toString(), undefined, {numeric: true});
      });

      tbody.innerHTML = "";
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #64748b;">कोई रिकॉर्ड नहीं मिला।</td></tr>`;
      } else {
        filtered.forEach(st => {
          const key = st.studentId || st.srNo;
          const isChecked = selectedStudentIds.has(key);
          tbody.innerHTML += `
            <tr>
              <td><input type="checkbox" value="${key}" ${isChecked ? 'checked' : ''} onchange="toggleSelect(this)"></td>
              <td><strong>${st.srNo || '-'}</strong></td>
              <td>${st.studentName}</td>
              <td>${st.fatherName}</td>
              <td>${st.className} ${st.section || ''}</td>
              <td><span style="background:#e2e8f0; padding:2px 6px; border-radius:4px; font-size:12px;">${st.session || '-'}</span></td>
            </tr>
          `;
        });
      }
      document.getElementById('selected-count').innerText = selectedStudentIds.size;
    }

    function toggleSelect(cb) {
      if (cb.checked) selectedStudentIds.add(cb.value);
      else selectedStudentIds.delete(cb.value);
      document.getElementById('selected-count').innerText = selectedStudentIds.size;
    }

    function toggleSelectAll(masterCb) {
      const search = document.getElementById('search-input').value.toLowerCase();
      const classVal = document.getElementById('class-filter').value;
      const sessionVal = document.getElementById('session-filter').value;
      
      allStudents.filter(s => {
        const matchesSearch = (s.studentName + " " + s.fatherName + " " + s.srNo).toLowerCase().includes(search);
        const matchesClass = !classVal || s.className === classVal;
        const matchesSession = !sessionVal || s.session === sessionVal;
        return matchesSearch && matchesClass && matchesSession;
      }).forEach(s => {
        const key = s.studentId || s.srNo;
        if (masterCb.checked) selectedStudentIds.add(key);
        else selectedStudentIds.delete(key);
      });

      renderTable();
    }

    function sortTable(col) {
      if (currentSort.col === col) currentSort.asc = !currentSort.asc;
      else { currentSort.col = col; currentSort.asc = true; }
      renderTable();
    }

    function renderMobileBoxes(mobile) {
      const num = (mobile || "").toString().replace(/\D/g, "");
      let html = '<div class="box-digits">';
      for (let i = 0; i < 10; i++) {
        html += `<span class="box-digit">${num[i] || ''}</span>`;
      }
      html += '</div>';
      return html;
    }

    function renderDateBoxes(d, m, y) {
      let dStr = String(d || "").padStart(2, '0');
      let mStr = String(m || "").padStart(2, '0');
      let yStr = String(y || "");
      return `
        <span style="margin-right:2px;">Date</span><div class="box-digits"><span class="box-digit">${dStr[0]||''}</span><span class="box-digit">${dStr[1]||''}</span></div>
        <span style="margin: 0 2px 0 4px;">Month</span><div class="box-digits"><span class="box-digit">${mStr[0]||''}</span><span class="box-digit">${mStr[1]||''}</span></div>
        <span style="margin: 0 2px 0 4px;">Year</span><div class="box-digits">
          <span class="box-digit">${yStr[0]||''}</span><span class="box-digit">${yStr[1]||''}</span><span class="box-digit">${yStr[2]||''}</span><span class="box-digit">${yStr[3]||''}</span>
        </div>
      `;
    }

    function buildCardHTML(st) {
      // Auto-extract day/month/year if not separately present
      let day = st.dobDay;
      let month = st.dobMonth;
      let year = st.dobYear;

      if ((!day || !month || !year) && st.dob) {
        let parts = st.dob.split(/[-/]/);
        if (parts.length === 3) {
          day = parts[0];
          month = parts[1];
          year = parts[2];
        }
      }

      const dobInWords = convertDateToWords(day, month, year);

      return `
        <div class="sr-card">
          <!-- Header -->
          <div class="sr-header">
            <div style="width: 60px;"></div>
            <div class="sr-title-block">
              <h2>छात्र पत्रावली तथा स्थानान्तरण प्रमाण–पत्र</h2>
              <p>(Scholar's Register & Transfer Certificate Form)</p>
            </div>
            <div class="sr-number-badge">${st.srNo || ''}</div>
          </div>

          <!-- Meta Line -->
          <div class="meta-line">
            <div class="meta-cell">प्रवेश फाइल सं०....................</div>
            <div class="meta-cell">निष्कासन फाइल सं०....................</div>
            <div class="meta-cell">स्थानान्तरण प्रमाण पत्र सं०....................</div>
            <div class="meta-cell">पंजिका सं०....................</div>
          </div>

          <!-- Main Details Grid -->
          <table class="main-grid">
            <thead>
              <tr>
                <th style="width: 22%;">छात्र/छात्रा का नाम राष्ट्रीयता एवं जाति यदि हिन्दू हो अथवा धर्म<br><span style="font-size:7.5px;">Name of Scholar with nationality Caste Hindu otherwise religion</span></th>
                <th style="width: 14%;">छात्र का आधार कार्ड नं०<br><span style="font-size:7.5px;">Scholar's Aadhar No.</span></th>
                <th style="width: 28%;">संरक्षक/पिता अथवा पति का नाम पता तथा वृत्ति<br><span style="font-size:7.5px;">Name Address & Occupation of Father, Guardian or Husband</span></th>
                <th style="width: 22%;">माता का नाम पता तथा वृत्ति<br><span style="font-size:7.5px;">Name of Mother, address & occupation</span></th>
                <th style="width: 14%;">अन्तिम संस्था जिसमें पढ़ा/पढ़ी हो<br><span style="font-size:7.5px;">The Last Institution attended</span></th>
              </tr>
            </thead>
            <tbody>
              <tr style="height: 52px;">
                <td>
                  <strong>${st.studentName || ''}</strong><br>
                  INDIAN<br>
                  ${st.caste ? st.caste + ' / ' : ''}${st.religion || ''}
                </td>
                <td style="text-align: center; vertical-align: middle; font-weight: bold;">
                  ${st.studentAadhaar || ''}
                </td>
                <td>
                  <strong>${st.fatherName || ''}</strong><br>
                  ${st.address || ''}<br>
                  ${st.fatherOccupation ? 'व्यवसाय: ' + st.fatherOccupation : ''}<br>
                  Mob. No. ${renderMobileBoxes(st.mobile)}
                </td>
                <td>
                  <strong>${st.motherName || ''}</strong><br>
                  ${st.address || ''}<br>
                  ${st.motherOccupation ? 'वृत्ति: ' + st.motherOccupation : ''}
                </td>
                <td></td>
              </tr>
            </tbody>
          </table>

          <!-- DOB Strips -->
          <div class="info-strip">
            <div class="strip-cell" style="width: 44%; display: flex; align-items: center;">
              <span style="font-weight:600; margin-right:4px;">जन्मतिथि / Date of Birth:</span> 
              ${renderDateBoxes(day, month, year)}
            </div>
            <div class="strip-cell" style="width: 56%;">
              <span style="font-weight:600;">जन्मतिथि (शब्दों में) / Date of Birth:</span> 
              <span style="font-weight: bold; margin-left: 4px;">${dobInWords}</span>
            </div>
          </div>

          <!-- PEN / APAAR / UDISE -->
          <div class="info-strip">
            <div class="strip-cell" style="width: 38%;">
              छात्र/छात्रा का PEN नं० : <strong>${st.penNo || ''}</strong>
            </div>
            <div class="strip-cell" style="width: 32%;">
              अपार आई. डी. / APAAR ID.:
            </div>
            <div class="strip-cell" style="width: 30%;">
              विद्यालय का यू डायस कोड :
            </div>
          </div>

          <!-- Bottom Class Table -->
          <table class="table-footer">
            <thead>
              <tr>
                <th rowspan="2" style="width: 7%;">कक्षा</th>
                <th rowspan="2" style="width: 10%;">प्रवेश तिथि</th>
                <th rowspan="2" style="width: 10%;">कक्षोन्नति</th>
                <th rowspan="2" style="width: 10%;">निष्कासन तिथि</th>
                <th rowspan="2" style="width: 25%;">निष्कासन का कारण जैसे शुल्क का आशोधन, कुटुम्ब का प्रस्थान</th>
                <th colspan="3" style="width: 24%;">प्रस्थान के समय छात्र के सम्बन्ध में विवरण</th>
                <th rowspan="2" style="width: 14%;">हस्ताक्षर</th>
              </tr>
              <tr>
                <th style="width: 8%;">वर्ष</th>
                <th style="width: 8%;">आचरण</th>
                <th style="width: 8%;">कार्य</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>${st.className || ''}</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    function prepareAndPrint() {
      const selectedList = allStudents.filter(s => selectedStudentIds.has(s.studentId || s.srNo));
      if (selectedList.length === 0) return alert('कृपया प्रिंट करने के लिए कम से कम 1 छात्र चुनें!');

      const printContainer = document.getElementById('print-container');
      printContainer.innerHTML = "";

      for (let i = 0; i < selectedList.length; i += 2) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'sr-page' + (i + 2 < selectedList.length ? ' page-break' : '');
        
        let card1 = buildCardHTML(selectedList[i]);
        let card2 = selectedList[i + 1] ? buildCardHTML(selectedList[i + 1]) : '';
        
        pageDiv.innerHTML = card1 + card2;
        printContainer.appendChild(pageDiv);
      }

      window.print();
    }

    document.addEventListener('DOMContentLoaded', fetchSheetData);
  </script>
</body>
</html>
